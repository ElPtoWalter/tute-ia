name: QA Sala Cero
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:static
      - run: pnpm run test:unit
  browsers:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit, offline]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instalar el motor
        run: pnpm exec playwright install --with-deps ${{ matrix.browser == 'offline' && 'chromium' || matrix.browser }}
      - name: Chromium · 28 juegos · cinco viewports
        if: matrix.browser == 'chromium'
        run: pnpm exec playwright test --project=desktop-1440x900 --project=tablet-768x1024 --project=mobile-390x844 --project=compact-360x800 --project=landscape-844x390
      - name: Firefox o WebKit · catálogo y flujos críticos
        if: matrix.browser == 'firefox' || matrix.browser == 'webkit'
        run: pnpm exec playwright test --project=${{ matrix.browser }}-smoke
      - name: PWA · offline y actualización
        if: matrix.browser == 'offline'
        run: pnpm exec playwright test --project=offline-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  publication:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validation, browsers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Comprobar Pages real, versión y ruleta offline
        run: node tests/live-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publicacion-v27
          path: test-results/
          retention-days: 14
