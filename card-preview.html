h1,p{max-width:1500px;margin:0 auto} p{color:#b8c9c0;margin-top:7px}
.deck{max-width:1500px;margin:24px auto 0;display:grid;grid-template-columns:repeat(10,minmax(70px,1fr));gap:12px}
img{width:100%;display:block;border-radius:8px;filter:drop-shadow(0 12px 16px rgba(0,0,0,.38))}
@media(max-width:900px){.deck{grid-template-columns:repeat(5,1fr)}}
