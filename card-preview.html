<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vista previa de la baraja</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 30px; background: radial-gradient(circle at center, rgba(74,145,104,.28), transparent 50%), #071c17; }
  h1 { max-width: 1200px; margin: 0 auto 22px; font-family: Georgia, serif; }
  .deck { max-width: 1200px; margin: auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); gap: 14px; }
  img { width: 100%; aspect-ratio: 620 / 956; object-fit: contain; filter: drop-shadow(0 14px 15px rgba(0,0,0,.42)); }
</style>
</head>
<body>
<h1>Baraja tradicional de Tute IA</h1>
<div class="deck">
  <img src="assets/cards/oros-1.webp" alt="As de oros">
  <img src="assets/cards/oros-3.webp" alt="Tres de oros">
  <img src="assets/cards/oros-10.webp" alt="Sota de oros">
  <img src="assets/cards/oros-11.webp" alt="Caballo de oros">
  <img src="assets/cards/oros-12.webp" alt="Rey de oros">
  <img src="assets/cards/copas-1.webp" alt="As de copas">
  <img src="assets/cards/copas-7.webp" alt="Siete de copas">
  <img src="assets/cards/copas-12.webp" alt="Rey de copas">
  <img src="assets/cards/espadas-1.webp" alt="As de espadas">
  <img src="assets/cards/espadas-3.webp" alt="Tres de espadas">
  <img src="assets/cards/espadas-10.webp" alt="Sota de espadas">
  <img src="assets/cards/espadas-11.webp" alt="Caballo de espadas">
  <img src="assets/cards/espadas-12.webp" alt="Rey de espadas">
  <img src="assets/cards/bastos-1.webp" alt="As de bastos">
  <img src="assets/cards/bastos-7.webp" alt="Siete de bastos">
  <img src="assets/cards/back.webp" alt="Reverso">
</div>
</body>
</html>
